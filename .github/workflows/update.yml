name: Cập nhật dashboard

on:
  schedule:
    - cron: "0 11 * * 1-5"    # 18:00 giờ Việt Nam, thứ Hai đến thứ Sáu
  workflow_dispatch:

permissions:
  contents: write             # ghi tệp LAST_UPDATE
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 18:00 mất khoảng 25 phút, chạy tay buổi sáng có thể hơn 1 giờ
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tải dữ liệu và tính toán
        env:
          FINLENS_API_KEY: ${{ secrets.FINLENS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -W ignore update.py

      - name: Kiểm tra và gom trang
        run: python make_public.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub tự tắt lịch chạy nếu kho im lặng 60 ngày, tệp này giữ kho luôn có hoạt động
      - name: Ghi dấu lần cập nhật
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > LAST_UPDATE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_UPDATE
          git commit -m "Cập nhật dữ liệu" || exit 0
          git push
