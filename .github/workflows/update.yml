name: Cập nhật dashboard

# Có hai đường chạy:
#   ui   : chỉ đổi giao diện. Dùng lại dữ liệu đang có trên trang, 1 đến 2 phút, không gọi FinLens.
#   full : tải dữ liệu và tính lại. Lịch 18:17 khoảng 25 phút, chạy tay buổi sáng có thể hơn 1 giờ.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build_page.py"
      - "make_public.py"
  schedule:
    # GitHub chạy lịch theo khả năng, hay trễ hoặc bỏ hẳn lần chạy đúng đầu giờ, nên tránh phút 00 và có lần chạy bù
    - cron: "17 11 * * 1-5"   # 18:17 giờ Việt Nam, thứ Hai đến thứ Sáu
    - cron: "43 13 * * 1-5"   # 20:43, chạy bù, tự bỏ qua nếu hôm nay đã cập nhật
  workflow_dispatch:
    inputs:
      mode:
        description: "ui: chỉ giao diện. full: tải dữ liệu và tính lại"
        type: choice
        options: [full, ui]
        default: full

permissions:
  contents: write             # ghi tệp LAST_UPDATE
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'push' && 'ui' || inputs.mode || 'full' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event.schedule }}" = "43 13 * * 1-5" ] && grep -q "$(date -u +%Y-%m-%d)" LAST_UPDATE; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150      # đường full buổi sáng có thể hơn 1 giờ
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài thư viện
        if: env.MODE == 'full'
        run: pip install -r requirements.txt

      - name: Tải dữ liệu và tính toán
        if: env.MODE == 'full'
        env:
          FINLENS_API_KEY: ${{ secrets.FINLENS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -W ignore update.py

      - name: Dùng lại dữ liệu đang có và dựng giao diện
        if: env.MODE == 'ui'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python fetch_live.py
          python build_page.py

      - name: Kiểm tra và gom trang
        run: python make_public.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub tự tắt lịch chạy nếu kho im lặng 60 ngày, tệp này giữ kho luôn có hoạt động
      - name: Ghi dấu lần cập nhật
        if: env.MODE == 'full'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > LAST_UPDATE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_UPDATE
          git commit -m "Cập nhật dữ liệu" || exit 0
          git push
